name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # Every macOS runner label that is still supported, both arches.
        # macos-14 is excluded on purpose: it is fully unsupported from
        # 2 November 2026. macos-13 is already retired, and GitHub keeps only
        # the latest two macOS versions. The -intel images are the last x86_64
        # runners Actions will offer -- they retire in August 2027, after which
        # x86_64 bottles need building elsewhere.
        # arm64 only. homebrew/core no longer builds macOS Intel bottles --
        # openssl@3 and pkgconf have none at all, ldns and libfido2 stop at
        # sonoma -- so libsk-libfido2 is always skipped on an Intel runner and
        # those jobs only ever produced an ssh-askpass bottle, which is a plain
        # script install and gains nothing from being bottled. Intel users build
        # from source, exactly as they did before.
        #
        # xcode-27 is the macOS 27 image: from macOS 27 on the runner label is
        # `xcode-<version>`, not `macos-<version>`. It is still public preview
        # (announced 2026-09-10); fail-fast is off so it cannot take the others
        # down with it.
        os: [xcode-27, macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/michaelroosz/ssh
        if: github.event_name == 'pull_request'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
